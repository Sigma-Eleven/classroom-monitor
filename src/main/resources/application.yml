server:
  port: 8080

logging:
  level:
    com.example.classroom_monitor: DEBUG
    org.springframework.ai: DEBUG

spring:
  application:
    name: classroom-monitor
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB # 上传图片大小限制
      max-request-size: 10MB # 单次请求大小限制
  mvc:
    async:
      request-timeout: 30s # 接口整体超时（异步请求），避免长时间阻塞

  ai:
    model:
      audio:
        speech: disabled
        transcription: disabled
    openai:
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn} # Kimi（Moonshot）OpenAI 兼容接口地址
      api-key: ${KIMI_API_KEY:} # Kimi API Key（建议使用环境变量注入）
      chat:
        enabled: ${APP_AI_ENABLED:false}
        completions-path: ${KIMI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${KIMI_MODEL:moonshot-v1-8k-vision-preview}
          temperature: 0.0
          max-tokens: 2048 # 增加最大 Token 数，防止长 JSON 截断

app:
  upload:
    dir: ./uploads # 图片临时保存目录（相对路径：以启动目录为基准）
    max-size: 10MB # 后端二次校验：文件大小
    allowed-content-types: ["image/jpeg", "image/png", "image/webp"] # 允许的图片 MIME
    allowed-extensions: ["jpg", "jpeg", "png", "webp"] # 允许的文件后缀
  ai:
    enabled: ${APP_AI_ENABLED:false} # 是否启用真实 AI 调用；默认走模拟识别
    request-timeout: 30s # AI 调用超时
  analysis:
    weights:
      ATTENTIVE: 1.0
      HEAD_DOWN: 0.6
      SLEEPING: 0.0
      PHONE: 0.1
      DISTRACTED: 0.4
      OTHER: 0.5
