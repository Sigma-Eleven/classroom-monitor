<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>课堂专注度监测与学习行为分析助手</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>课堂专注度监测与学习行为分析助手</h1>

    <section class="card">
      <h2>1) 上传课堂图片</h2>
      <form id="uploadForm">
        <input id="fileInput" name="file" type="file" accept="image/*" />
        <button id="submitBtn" type="submit">上传并识别</button>
      </form>
      <div id="tips" class="tips">支持 JPG / PNG / WEBP。识别记录保存在内存中（重启清空）；图片会保存到 ./uploads（同内容自动去重）。</div>
      <div id="error" class="error hidden"></div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>2) 图片预览</h2>
        <div class="preview">
          <img id="previewImg" alt="预览" />
        </div>
      </div>

      <div class="card">
        <h2>3) 指标概览</h2>
        <div class="kpis">
          <div class="kpi">
            <div class="kpi-label">专注度分数</div>
            <div id="focusScore" class="kpi-value">-</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">抬头率</div>
            <div id="attentiveRate" class="kpi-value">-</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">学生总数</div>
            <div id="totalStudents" class="kpi-value">-</div>
          </div>
        </div>
        <div id="summary" class="summary">-</div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>4) 行为占比图</h2>
        <canvas id="pieChart" height="220"></canvas>
      </div>
      <div class="card">
        <h2>5) 行为人数明细</h2>
        <table class="table" id="behaviorTable">
          <thead>
            <tr>
              <th>行为</th>
              <th>人数</th>
              <th>占比</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
